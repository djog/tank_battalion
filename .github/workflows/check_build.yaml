# Check that the Processing sketch can be built
name: Check build

on:
  push:
    paths:
      - .github/workflows/check_build.yaml
      - "**.pde"
  pull_request:
    paths:
      - .github/workflows/check_build.yaml
      - "**.pde"
  workflow_dispatch:

env:
  PROCESSING_URL: https://github.com/processing/processing4/releases/download/processing-1293-4.3/processing-4.3-linux-x64.tgz

jobs:
  check_build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Processing
        run: |
          curl --fail --silent --show-error --location --output processing.tgz "$PROCESSING_URL"
          tar xzf processing.tgz -C "$RUNNER_TEMP"
          rm processing.tgz

      # Download links as in Processing's library index,
      # https://github.com/processing/processing-contributions/blob/main/contributions.yaml
      - name: Install the Processing libraries the game uses
        run: |
          mkdir -p ~/sketchbook/libraries
          curl --fail --silent --show-error --location --output sound.zip https://github.com/processing/processing-sound/releases/latest/download/sound.zip
          unzip -q -o sound.zip -d ~/sketchbook/libraries
          ls ~/sketchbook/libraries

      # processing-java needs the sketch folder to have the same name
      # as the sketch's main .pde file
      - name: Build the sketch
        run: |
          xvfb-run -a "$RUNNER_TEMP/processing-4.3/processing-java" \
            --sketch="${{ github.workspace }}/tank_battalion" \
            --output="$RUNNER_TEMP/build" \
            --force \
            --build
